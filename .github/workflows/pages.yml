name: Deploy GitHub Pages

on:
  push:
    branches: [main, version-3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build V1
        working-directory: v1
        run: |
          npm ci
          npm run build
      - name: Checkout V3
        uses: actions/checkout@v4
        with:
          ref: version-3
          path: v3
      - name: Install and build V3
        working-directory: v3
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p deploy/v3
          cp -R v1/out/. deploy/
          cp -R v3/out/. deploy/v3/
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4